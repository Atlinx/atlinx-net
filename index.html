<!DOCTYPE html>
<meta charset="utf-8">
<html>

<head>
  <title>Atlinx</title>
  <meta name="title" content="Atlinx">
  <meta name="description" content="Grad Student, Robotics Researcher, Game Dev, and Artist">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://atlinx.net/">
  <meta property="og:title" content="Atlinx">
  <meta property="og:description" content="Grad Student, Robotics Researcher, Game Dev, and Artist">
  <meta property="og:image" content="https://atlinx.net/pictures/cowgirl_bg_pink.png">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://atlinx.net/">
  <meta property="twitter:title" content="Atlinx">
  <meta property="twitter:description" content="Grad Student, Robotics Researcher, Game Dev, and Artist">
  <meta property="twitter:image" content="https://atlinx.net/pictures/cowgirl_bg_pink.png">

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="pictures/cowgirl_pfp_3.jpg">
  <style>
    :root {
      --color-pink: #FF6798;
      --color-white: #E6E6E6;
    }

    @font-face {
      font-family: 'Urbanist';
      src: url('fonts/urbanist-latin-500-normal.woff2') format('woff2');
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'Urbanist';
      src: url('fonts/urbanist-latin-900-normal.woff2') format('woff2');
      font-weight: 900;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'RL Madena';
      src: url('fonts/RL-Madena.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'Novecento';
      src: url('fonts/Novecentosanswide-Normal.woff2') format('woff2');
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }

    :root {
      font-family: 'Urbanist', sans-serif;
      color: var(--color-white);
    }

    p {
      font-weight: 500;
    }

    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    b {
      font-weight: 900;
    }

    a:active,
    a:link {
      color: var(--color-white);
    }

    a:visited {
      color: var(--color-white);
    }

    a:hover {
      font-weight: bold;
    }

    .button:active,
    .button:visited,
    .button:link,
    .button,
    button {
      background-color: var(--color-white);
      padding: 0.5em 2em;
      font-family: 'Urbanist', sans-serif;
      font-size: 1em;
      font-weight: 500;
      color: var(--color-pink);
      transition: ease-out 0.1s;
      border: none;
      text-decoration: inherit;
      white-space: nowrap;
    }

    .button:hover,
    button:hover {
      background-color: var(--color-pink);
      color: var(--color-white);
      transform: scale(1.03) translateY(-5%);
    }

    .subtitle {
      font-family: "Novecento", sans-serif;
      font-weight: 500;
      font-size: 1em;
      text-transform: uppercase;
      letter-spacing: 1em;
    }

    .title {
      font-family: "RL Madena", sans-serif;
      text-transform: uppercase;
      letter-spacing: -0.077em;
      display: inline-block;
      transform: scale(1, 1);
      scale: 1 1.75;
    }

    .big-title {
      font-size: 5em;
      margin: 0;
      font-weight: 100;
    }

    .avatar {
      width: 15em;
      height: 15em;
      border-radius: 50%;
    }

    .content-left {
      max-width: 30em;
    }

    .content-container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: inherit;
      min-height: inherit;
      padding: 4em;
      box-sizing: border-box;
    }

    .content-window {
      background-color: var(--color-pink);
      /* border: 8px solid var(--color-white); */
      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: center;
      width: fit-content;
      gap: 4em;
      padding: 2em;
    }

    @media screen and (max-width: 1000px) {
      :root {
        font-size: 90%;
      }

      .content-window {
        flex-direction: column;
      }
    }

    @media screen and (max-width: 600px) {
      :root {
        font-size: 80%;
      }

      .big-title {
        font-size: 4em;
        margin: 0;
        font-weight: 900;
      }

      .content-container {
        padding: 1em;
      }

      .content-window {
        padding: 1em;
      }
    }

    @media screen and (max-width: 400px) {
      :root {
        font-size: 80%;
      }

      .big-title {
        font-size: 3em;
        margin: 0;
        font-weight: 900;
      }
    }

    .show {
      opacity: 0;
      animation: show 1s forwards;
    }

    :root {
      --stagger: 200ms;
    }

    .stagger-0 {
      animation-delay: calc(var(--stagger) * 0);
    }

    .stagger-1 {
      animation-delay: calc(var(--stagger) * 1);
    }

    .stagger-2 {
      animation-delay: calc(var(--stagger) * 2);
    }

    .stagger-3 {
      animation-delay: calc(var(--stagger) * 3);
    }

    .stagger-4 {
      animation-delay: calc(var(--stagger) * 4);
    }

    .stagger-5 {
      animation-delay: calc(var(--stagger) * 5);
    }

    @keyframes show {
      0% {
        opacity: 0;
        transform: translateY(-10%);
      }

      100% {
        opacity: 1;
        transform: translateY(0%);
      }
    }
  </style>
  <script src="https://code.iconify.design/2/2.2.1/iconify.min.js"></script>
</head>

<body>
  <div style="
    background-blend-mode: multiply;
    background-image: url('pictures/cowgirl_bg_pink_left.png');
    background-position: center;
    background-repeat: repeat-x;
    background-size: cover;
    min-height: 100vh;
    min-width: 100vw;
  ">
    <div class="content-container">
      <div class="content-window show stagger-0">
        <div class="content-left">
          <h1 class="title big-title show stagger-0">Atlinx</h1>
          <h1 class="subtitle show stagger-0">THROUGH THE STORM WE HELD STEADY</h1>
          <div class="show stagger-1">
            <p>Hey everyone, I'm <b>Alina</b> (she/her). I also go by <b>Atlinx</b> online.</p>
            <p>I'm a programmer, full-stack web developer, game developer, and part-time artist. I run a small indie
              game development studio called <a href="https://www.fracturalstudios.com" target="_blank">fractural
                studios</a>.</p>
          </div>
          <div class="show stagger-2">
            <h2 class="title">Socials</h2>
            <div style="
              display: flex;
              flex-direction: row;
              flex-wrap: wrap;
              gap: 1em;
            ">
              <a class="button" href="https://twitter.com/atlinxnet" target="_blank">
                <span class="iconify-inline" data-icon="akar-icons:twitter-fill"></span>
                AtlinxNet
              </a>
              <a class="button" href="https://twitter.com/atlinxart" target="_blank">
                <span class="iconify-inline" data-icon="akar-icons:twitter-fill"></span>
                AtlinxArt
              </a>
              <a class="button" href="https://github.com/atlinx" target="_blank">
                <span class="iconify-inline" data-icon="akar-icons:github-fill"></span>
                Atlinx
              </a>
            </div>
          </div>
        </div>
        <img class="avatar show stagger-1" src="pictures/cowgirl_pfp_3.jpg">
      </div>
    </div>
  </div>
</body>

</html>
